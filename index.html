<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nexus — Your whole day, in one quiet place</title>
    <meta name="description" content="Tasks, notes, calendar, habits, focus and finances in one private workspace that lives on your device. Free, no account, works offline." />
    <link rel="canonical" href="https://nexus-six-liard.vercel.app/" />

    <!-- Icons -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f5f5f7" />

    <!-- Installed-app behaviour -->
    <meta name="application-name" content="Nexus" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Share previews (WhatsApp, LinkedIn, Slack, iMessage, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexus" />
    <meta property="og:url" content="https://nexus-six-liard.vercel.app/" />
    <meta property="og:title" content="Nexus — Your whole day, in one quiet place" />
    <meta property="og:description" content="Tasks, notes, calendar, habits, focus and money in one private workspace. Free, no account, works offline." />
    <meta property="og:image" content="https://nexus-six-liard.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Nexus dashboard next to the headline “Your whole day, in one quiet place.”" />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus — Your whole day, in one quiet place" />
    <meta name="twitter:description" content="Tasks, notes, calendar, habits, focus and money in one private workspace. Free, no account, works offline." />
    <meta name="twitter:image" content="https://nexus-six-liard.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="The Nexus dashboard next to the headline “Your whole day, in one quiet place.”" />

    <!-- Search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Nexus",
        "url": "https://nexus-six-liard.vercel.app/",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Tasks, notes, calendar, habits, focus and finances in one private, offline-capable workspace."
      }
    </script>
  </head>
  <body>
    <noscript>Nexus needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
